<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume PDF Viewer</title>
    <link rel="stylesheet" href="pdfjs-viewer.css">
</head>
<body>
    <div class="container">
        <h1 style="text-align:center;">My Resume</h1>
        <div id="pdf-viewer">
            <canvas id="pdf-canvas"></canvas>
        </div>
        <a href="Resume.pdf" download class="download-btn">Download PDF</a>
    </div>
    <!-- PDF.js library: using local .mjs files as ES modules -->
    <script type="module" src="pdfjs-viewer.js"></script>
</body>
</html>
