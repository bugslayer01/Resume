<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume PDF Viewer</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f9f9f9; margin: 0; padding: 0; }
        .container { max-width: 900px; margin: 40px auto; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 24px; border-radius: 8px; }
        h1 { text-align: center; margin-bottom: 24px; }
        .pdf-viewer { display: flex; justify-content: center; margin-bottom: 24px; }
        .download-btn { display: block; margin: 0 auto; padding: 12px 32px; background: #0078d4; color: #fff; border: none; border-radius: 4px; font-size: 1.1em; cursor: pointer; text-decoration: none; transition: background 0.2s; }
        .download-btn:hover { background: #005fa3; }
    </style>
</head>
<body>
    <div class="container">
        <div class="pdf-viewer">
            <iframe src="./Resume.pdf" width="800" height="1000" style="border:1px solid #ccc; border-radius:4px;"></iframe>
        </div>
        <a href="./Resume.pdf" download class="download-btn">Download PDF</a>
    </div>
</body>
</html>
